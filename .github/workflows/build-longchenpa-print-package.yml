name: build Longchenpa print package

on:
  push:
    branches:
      - print/longchenpa-production-package
    paths:
      - "black_metal_buddhist_prints/02_two_ink_vector/longchenpa_rest_in_illusion_two_ink.svg"
      - "black_metal_buddhist_prints/START_HERE_FOR_PRINTER.txt"
      - "black_metal_buddhist_prints/MESSAGE_TO_PRINTER.txt"
      - "tools/build_longchenpa_print_package.py"
      - ".github/workflows/build-longchenpa-print-package.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow cairosvg
      - run: python tools/build_longchenpa_print_package.py
      - name: Validate generated production files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = [
              Path("black_metal_buddhist_prints/01_transparent_png/longchenpa_rest_in_illusion_12x16_300dpi.png"),
              Path("black_metal_buddhist_prints/02_two_ink_vector/longchenpa_rest_in_illusion_two_ink.svg"),
              Path("black_metal_buddhist_prints/03_two_ink_png/longchenpa_rest_in_illusion_two_ink_12x16_300dpi.png"),
              Path("black_metal_buddhist_prints/04_previews/longchenpa_rest_in_illusion_PNG_preview_on_black.jpg"),
              Path("black_metal_buddhist_prints/04_previews/longchenpa_rest_in_illusion_TWO_INK_preview_on_black.jpg"),
              Path("black_metal_buddhist_prints/04_previews/ALL_FOUR_artwork_preview.jpg"),
              Path("black_metal_buddhist_prints/05_original_mockups/longchenpa_rest_in_illusion_REFERENCE_ONLY.jpg"),
          ]
          for path in required:
              assert path.exists() and path.stat().st_size > 0, path

          image = Image.open(required[0]).convert("RGBA")
          assert image.size == (3600, 4800)
          dpi = image.info.get("dpi")
          assert dpi and abs(dpi[0] - 300) < 1 and abs(dpi[1] - 300) < 1
          assert image.getchannel("A").getextrema()[0] == 0
          assert image.getchannel("A").getextrema()[1] == 255
          PY
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add black_metal_buddhist_prints
          if git diff --cached --quiet; then
            echo "Print package already current."
          else
            git commit -m "Generate Longchenpa production print package"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
