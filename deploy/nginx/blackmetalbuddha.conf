server {
    listen 80;
    listen [::]:80;
    server_name blackmetalbuddha.com www.blackmetalbuddha.com;
    return 301 https://blackmetalbuddha.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.blackmetalbuddha.com;

    # TLS directives are managed by the VPS certificate workflow.
    # ssl_certificate ...
    # ssl_certificate_key ...

    return 301 https://blackmetalbuddha.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blackmetalbuddha.com;
    server_tokens off;

    # Add the VPS's existing ssl_certificate / ssl_certificate_key directives here.
    # Enable HSTS only after HTTPS is verified and stable:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /prints/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
