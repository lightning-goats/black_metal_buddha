server {
    listen 80;
    listen [::]:80;
    server_name blackmetalbuddha.com www.blackmetalbuddha.com;
    return 301 https://blackmetalbuddha.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.blackmetalbuddha.com;
    # TLS directives are managed by the VPS certificate workflow.
    return 301 https://blackmetalbuddha.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blackmetalbuddha.com;
    # Add the VPS's existing ssl_certificate / ssl_certificate_key directives here.

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
